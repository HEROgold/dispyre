# Weekly maintenance workflow: keeps test.yml's Python version matrix in
# sync with endoflife.date's live non-EOL Python data.
#
# Unlike release.yml (which pushes version bumps straight to main), this
# workflow deliberately opens a PR instead of pushing directly — widening
# or narrowing the CI test matrix can surface real, previously-invisible
# incompatibilities, so a human should look at the diff before it merges.
#
# peter-evans/create-pull-request is used with a stable `branch:` name
# (see below) specifically so that subsequent weekly runs push new commits
# to the SAME branch/PR rather than opening a new one each time — the
# action force-updates an existing branch it previously created when the
# branch name is unchanged and the PR is still open.
name: Update Python version matrix

on:
  schedule:
    - cron: "0 6 * * 1"  # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute current non-EOL Python versions and update test.yml
        id: update
        run: |
          set -eu
          python3 - <<'PYEOF'
          import json
          import re
          import datetime
          import urllib.request

          WORKFLOW_PATH = ".github/workflows/test.yml"

          with urllib.request.urlopen("https://endoflife.date/api/python.json", timeout=10) as resp:
              cycles = json.load(resp)

          today = datetime.date.today()
          non_eol = []
          for cycle in cycles:
              eol = cycle.get("eol")
              if eol is False:
                  non_eol.append(cycle["cycle"])
                  continue
              if isinstance(eol, str):
                  try:
                      if datetime.date.fromisoformat(eol) >= today:
                          non_eol.append(cycle["cycle"])
                  except ValueError:
                      continue

          def sort_key(v):
              return tuple(int(p) for p in v.split("."))

          non_eol.sort(key=sort_key)

          with open(WORKFLOW_PATH, encoding="utf-8") as f:
              content = f.read()

          # Find the python-version list block (a run of `          - "3.NN"`
          # lines) and read the existing floor from it, so we never drop
          # below the project's own configured min_python_version.
          existing = re.findall(r'^ {10}- "(3\.\d+)"$', content, flags=re.MULTILINE)
          if not existing:
              raise SystemExit(f"Could not find python-version list in {WORKFLOW_PATH}")

          floor = min(existing, key=sort_key)
          new_versions = [v for v in non_eol if sort_key(v) >= sort_key(floor)]

          if sorted(new_versions, key=sort_key) == sorted(existing, key=sort_key):
              print("No change needed.")
              changed = False
          else:
              new_block = "\n".join(f'          - "{v}"' for v in new_versions)
              old_block = "\n".join(f'          - "{v}"' for v in existing)
              if old_block not in content:
                  raise SystemExit("Could not locate exact python-version block to replace.")
              content = content.replace(old_block, new_block)
              with open(WORKFLOW_PATH, "w", encoding="utf-8") as f:
                  f.write(content)
              print(f"Updated matrix: {existing} -> {new_versions}")
              changed = True

          gh_output = "changed=" + ("true" if changed else "false") + "\n"
          import os
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(gh_output)
          PYEOF

      - name: Open PR with matrix update
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update Python version matrix"
          title: "chore: update Python version matrix"
          body: |
            Automated update of the Python version matrix in `test.yml`,
            based on current non-EOL versions from endoflife.date.

            Please review before merging — a wider/narrower matrix can
            surface new compatibility issues.
          branch: chore/update-python-matrix
          delete-branch: true
