name: Security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  skylos:

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # VERIFY: skylos is a niche/less-common dead-code detection tool —
      # its exact CLI (subcommand name, flags, config file) is unconfirmed
      # here. Assuming a simple `uvx skylos .` invocation against the repo
      # root; adjust once the real interface is checked.
      - name: Run skylos (dead-code detection)
        run: uvx skylos .
