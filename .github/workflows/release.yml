# Label-driven version bump + release, triggered when a PR merges to main.
#
# Labels checked (case-insensitively, mirroring HEROgold's convention —
# see commit d84f566 "Make label checks case-insensitive for version bump"):
#   bump:major / bump:minor / bump:patch
#
# This bumps pyproject.toml's version and pushes DIRECTLY to main (no PR) —
# unlike update-python-matrix.yml, a pure version-string bump is exactly the
# kind of mechanical change the user wants auto-applied without review.
name: Release

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  release:

    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Determine bump level from PR labels
        id: bump-level
        run: |
          set -eu
          LABELS=$(echo '${{ toJson(github.event.pull_request.labels.*.name) }}' | tr '[:upper:]' '[:lower:]')
          LEVEL=""
          if echo "$LABELS" | grep -q '"bump:major"'; then
            LEVEL="major"
          elif echo "$LABELS" | grep -q '"bump:minor"'; then
            LEVEL="minor"
          elif echo "$LABELS" | grep -q '"bump:patch"'; then
            LEVEL="patch"
          fi
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"

      - name: Bump version in pyproject.toml
        id: bump-version
        if: steps.bump-level.outputs.level != ''
        run: |
          set -eu
          LEVEL="${{ steps.bump-level.outputs.level }}"
          CURRENT_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          NEW_VERSION=$(python3 -c "major, minor, patch = (int(p) for p in '$CURRENT_VERSION'.split('.')); parts = {'major': (major + 1, 0, 0), 'minor': (major, minor + 1, 0), 'patch': (major, minor, patch + 1)}['$LEVEL']; print('.'.join(str(p) for p in parts))")
          sed -i "s/^version = \"$CURRENT_VERSION\"/version = \"$NEW_VERSION\"/" pyproject.toml
          echo "version-bumped=true" >> "$GITHUB_OUTPUT"
          echo "new-version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and push version bump
        if: steps.bump-version.outputs.version-bumped == 'true'
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.bump-version.outputs.new-version }}"
          git push origin main

      - name: Tag release
        if: steps.bump-version.outputs.version-bumped == 'true'
        run: |
          set -eu
          TAG="v${{ steps.bump-version.outputs.new-version }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.bump-version.outputs.version-bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="v${{ steps.bump-version.outputs.new-version }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes
