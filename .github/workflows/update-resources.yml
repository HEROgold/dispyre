name: Update Discord resources

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: HEROgold/workflows/.github/actions/setup-uv-python@main
        with:
          sync-args: --group dev

      - run: uv run scripts/generate_resources.py

      # Builds on the resource models from the step above and fetches the gateway pages.
      - run: uv run scripts/generate_gateway_events.py

      - uses: peter-evans/create-pull-request@v6
        with:
          add-paths: |
            src/dispyre/discord/resources
            src/dispyre/discord/events
            tests/fixtures/gateway_event_examples.json
          branch: chore/update-discord-resources
          commit-message: "chore: regenerate Discord resources and gateway events"
          title: "chore: regenerate Discord resources and gateway events"
          body: |
            Discord's docs changed. Output of `scripts/generate_resources.py` and
            `scripts/generate_gateway_events.py`.

            0rwx: EXECUTE
          delete-branch: true
